<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Council of Achrona</title>
<style>
  :root { --bg:#0b1020; --panel:#141b33; --gold:#e8a23c; --text:#e8ecf8; --muted:#8a93b5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, serif; background: radial-gradient(circle at top, #1b2a6b, var(--bg) 60%); color:var(--text); min-height:100vh; }
  header { text-align:center; padding:32px 16px 8px; }
  h1 { margin:0; font-size:2.4rem; letter-spacing:1px; }
  header p { color:var(--muted); max-width:640px; margin:8px auto; }
  .table { display:flex; justify-content:center; gap:28px; flex-wrap:wrap; padding:20px; }
  .seat { text-align:center; width:120px; transition:transform .2s; }
  .avatar { width:80px; height:80px; border-radius:50%; margin:0 auto 6px; display:grid; place-items:center; font-size:38px; border:3px solid transparent; background:var(--panel); }
  .seat.speaking { transform:scale(1.12); }
  .seat.speaking .avatar { border-color:var(--gold); box-shadow:0 0 24px var(--gold); }
  .seat small { color:var(--muted); display:block; font-size:.75rem; }
  .controls { text-align:center; }
  button { font:inherit; font-size:1.1rem; background:var(--gold); color:#1a1200; border:0; padding:12px 28px; border-radius:999px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  main { max-width:760px; margin:20px auto 60px; padding:0 16px; }
  .round { color:var(--gold); text-transform:uppercase; letter-spacing:2px; font-size:.85rem; margin:28px 0 8px; border-bottom:1px solid #2a3560; padding-bottom:4px; }
  .msg { display:flex; gap:12px; margin:10px 0; animation:in .3s ease; }
  .msg .face { font-size:28px; flex:none; }
  .bubble { background:var(--panel); padding:10px 14px; border-radius:12px; line-height:1.45; white-space:pre-wrap; border-left:3px solid var(--c); }
  .bubble b { color:var(--c); }
  @keyframes in { from { opacity:0; transform:translateY(6px);} }
</style>
</head>
<body>
<header>
  <h1>The Council of Achrona</h1>
  <p>A glitch called the Desync broke Achrona's memories and systems. Each AI agent below knows a few different clues. Click the button to watch them share clues, discuss, vote, and make a plan to fix it.</p>
</header>

<div class="table" id="table"></div>
<div class="controls"><button id="start">Start the meeting</button></div>
<main id="log"></main>

<script>
// ---- AGENTS: personality + secret clues ----
const AGENTS = [
  { name:"Archivist", face:"📜", color:"#7fb2ff",
    system:"You are the Archivist of Achrona. You keep the records and care about facts and saving memories.",
    clues:["The memory archive started breaking at 3:12 at night.","The backup of all memories was last checked 40 days ago."] },
  { name:"Engineer", face:"⚙️", color:"#ffb36b",
    system:"You are the Engineer of Achrona. You fix machines and look for what actually broke.",
    clues:["There was a huge power spike at 3:10.","The clock program 'Chronos' updated itself at 3:09 without anyone allowing it."] },
  { name:"Oracle", face:"🔮", color:"#c792ff",
    system:"You are the Oracle of Achrona. You are careful and think about hidden dangers.",
    clues:["People say they dreamed about things from tomorrow, so time seems out of sync.","An old book warns: 'Never fix the memories before the clock is stopped.'"] },
];
const CHAIR = { name:"Chair", face:"👑", color:"#e8a23c",
  system:"You are the leader of the meeting. You are fair, you sum up what everyone said, and you decide." };
const OPTIONS = ["A) Restore the memories from the backup right away",
                 "B) First stop the Chronos program, then restore the memories",
                 "C) Rebuild the memories from what people dreamed"];

const table = document.getElementById("table"), log = document.getElementById("log");
[...AGENTS, CHAIR].forEach(a => {
  table.insertAdjacentHTML("beforeend",
    `<div class="seat" id="seat-${a.name}"><div class="avatar">${a.face}</div>${a.name}<small>${a.clues ? a.clues.length+" secret clues" : "leads the meeting"}</small></div>`);
});

const transcript = []; // shared group chat

async function ask(agent, prompt) {
  document.querySelectorAll(".seat").forEach(s => s.classList.remove("speaking"));
  document.getElementById("seat-"+agent.name).classList.add("speaking");
  const r = await fetch("/api/ask", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ system: agent.system + " Always use simple, everyday words and short sentences, like explaining to a 12-year-old. No jargon.", prompt, who: agent.name }) });
  const data = await r.json();
  const text = data.text || ("Error: " + data.error);
  transcript.push(`${agent.name}: ${text}`);
  log.insertAdjacentHTML("beforeend",
    `<div class="msg" style="--c:${agent.color}"><div class="face">${agent.face}</div><div class="bubble"><b>${agent.name}</b>\n${escapeHtml(text)}</div></div>`);
  window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
}
const round = t => log.insertAdjacentHTML("beforeend", `<div class="round">${t}</div>`);
const escapeHtml = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

document.getElementById("start").onclick = async (e) => {
  e.target.disabled = true; log.innerHTML = ""; transcript.length = 0;

  round("Step 1 · Share clues");
  for (const a of AGENTS)
    await ask(a, `The Desync shattered Achrona. Your private knowledge:\n- ${a.clues.join("\n- ")}\n\nTell the others your clues and what you think caused the glitch. Max 4 sentences.`);

  round("Step 2 · Discuss");
  for (const a of AGENTS)
    await ask(a, `Council transcript:\n${transcript.join("\n")}\n\nReact to the others: say what you agree with, what you doubt, and what you think now. Max 4 sentences.`);

  round("Step 3 · Vote");
  for (const a of AGENTS)
    await ask(a, `Transcript:\n${transcript.join("\n")}\n\nOptions:\n${OPTIONS.join("\n")}\nVote for ONE option. Start with the letter, then one sentence why.`);

  round("Step 4 · The plan");
  await ask(CHAIR, `Full transcript:\n${transcript.join("\n")}\n\nCount the votes, explain in one sentence what caused the glitch, and write a simple 5-step plan to fix Achrona.`);

  document.querySelectorAll(".seat").forEach(s => s.classList.remove("speaking"));
  e.target.disabled = false; e.target.textContent = "Start again";
};
</script>
</body>
</html>
